<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kalkulator Modern</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />

    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <div class="history" id="history"></div>
        <div class="result" id="result">0</div>
      </div>

      <div class="buttons">
        <button class="clear" id="clear">C</button>
        <button class="delete" id="delete">DEL</button>
        <button class="operator" id="bagi">/</button>

        <button class="number" id="n7">7</button>
        <button class="number" id="n8">8</button>
        <button class="number" id="n9">9</button>
        <button class="operator" id="kali">*</button>

        <button class="number" id="n4">4</button>
        <button class="number" id="n5">5</button>
        <button class="number" id="n6">6</button>
        <button class="operator" id="kurang">-</button>

        <button class="number" id="n1">1</button>
        <button class="number" id="n2">2</button>
        <button class="number" id="n3">3</button>
        <button class="operator" id="tambah">+</button>

        <button class="number" id="n0">0</button>
        <button class="number" id="koma">.</button>
        <button class="equals" id="hasil">=</button>
      </div>
    </div>
  </body>
</html>
